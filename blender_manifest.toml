schema_version = "1.0.0"

id = "Key_Ops_Toolkit"
version = "0.2.7"
name = "Key Ops: Toolkit"
tagline = "Industri Standard Tools & Shortcuts to Speed Up Blender Workflow"
maintainer = "Dan-Gry"
type = "add-on"

website = "https://dangry98.github.io/Key-Ops-Toolkit/"

tags = ["Modeling", "Mesh", "Object", "UV", "3D View"]

blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

copyright = [
  "2023-2026 Dan-Gry",
  "2020 Kramer84 (pyfqmr, MIT, bundled wheel for CAD Decimate)",
]

# pyfqmr (Fast Quadric Mesh Reduction) for the CAD Decimate "pyfqmr" mode.
# Unmodified wheels from PyPI, for the Python 3.11 and 3.13 builds of Blender.
wheels = [
  "./wheels/pyfqmr-0.5.0-cp311-cp311-macosx_10_9_x86_64.whl",
  "./wheels/pyfqmr-0.5.0-cp311-cp311-macosx_11_0_arm64.whl",
  "./wheels/pyfqmr-0.5.0-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.whl",
  "./wheels/pyfqmr-0.5.0-cp311-cp311-win_amd64.whl",
  "./wheels/pyfqmr-0.5.0-cp311-cp311-win_arm64.whl",
  "./wheels/pyfqmr-0.5.0-cp313-cp313-macosx_10_13_x86_64.whl",
  "./wheels/pyfqmr-0.5.0-cp313-cp313-macosx_11_0_arm64.whl",
  "./wheels/pyfqmr-0.5.0-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl",
  "./wheels/pyfqmr-0.5.0-cp313-cp313-win_amd64.whl",
  "./wheels/pyfqmr-0.5.0-cp313-cp313-win_arm64.whl",
]

[permissions]
files = "Export/Import .obj files and use of temp folder"

[build]
# Keep the docs site and dev files out of the extension zip
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.github/",
  "/.claude/",
  "/.vscode/",
  "/docs/",
  "/*.zip",
]
