schema_version = "1.0.0"

id = "Key_Ops_Toolkit"
version = "0.2.7"
name = "Key Ops: Toolkit"
tagline = "Industri Standard Tools & Shortcuts to Speed Up Blender Workflow"
maintainer = "Dan-Gry"
type = "add-on"

website = "https://dangry98.github.io/Key-Ops-Toolkit/"

tags = ["Modeling", "Mesh", "Object", "UV", "3D View"]

blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

[permissions]
files = "Export/Import .obj files and use of temp folder"

[build]
# Keep the docs site and dev files out of the extension zip
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.github/",
  "/.claude/",
  "/.vscode/",
  "/docs/",
  "/*.zip",
]
