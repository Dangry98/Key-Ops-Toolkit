schema_version = "1.0.0"

id = "Key_Ops_Toolkit"
version = "0.3.0"
name = "Key Ops: Toolkit"
tagline = "Industri Standard Tools & Shortcuts to Speed Up Blender Workflow"
maintainer = "Dan-Gry"
type = "add-on"

website = "https://dangry98.github.io/Key-Ops-Toolkit/"
support = "https://github.com/Dangry98/Key-Ops-Toolkit/issues"

tags = ["Modeling", "Mesh", "Object", "UV", "3D View"]

blender_version_min = "4.2.0"


license = [
  "SPDX:GPL-3.0-or-later",
]

copyright = [
  "2023-2026 Dan-Gry",
]

[permissions]
files = "Import/export settings and .obj files, use of temp folder"

[build]
# Keep the docs site and dev files out of the extension zip
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.github/",
  "/.claude/",
  "/.vscode/",
  "/docs/",
  "/*.zip",
  "/tests/",
  "/scripts/",
  "/CLAUDE.local.md",
  "/CLAUDE.md",
  "/.tmp",
  "/.gitignore",
  "/local/",
  ".favorites.json",
  "/tools/icons/*.py",
]
